<!DOCTYPE html>
<html>
<head>
    <title>审稿人登录 - Delicious 期刊</title>
    <style>
        body { background: #faf7f2; font-family: Georgia; padding: 2rem; }
        .login-box { max-width: 400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        h2 { color: #c44536; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border: 1px solid #d6cbbc; border-radius: 40px; }
        button { background: #c44536; color: white; border: none; padding: 0.8rem 2rem; border-radius: 40px; cursor: pointer; width: 100%; }
        .error { color: #a5281b; margin-bottom: 1rem; }
        a { color: #c44536; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 审稿人登录</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="输入审稿密码" required>
            <button type="submit">登录</button>
        </form>
        <p style="margin-top:1.5rem; text-align:center;"><a href="/">返回首页</a></p>
    </div>
</body>
</html>
